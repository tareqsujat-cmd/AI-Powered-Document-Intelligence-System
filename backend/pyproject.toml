[project]
name = "docintel-backend"
version = "0.1.0"
requires-python = ">=3.11,<3.12"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "db: requires a real PostgreSQL + pgvector server (TEST_DATABASE_URL)",
    "ocr: requires the Tesseract binary",
]

[tool.coverage.run]
source = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "C4", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S311", "S608"]
"migrations/versions/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["celery.*", "kombu.*", "pgvector.*", "pytesseract.*", "pymupdf.*", "olefile.*", "openpyxl.*", "xlrd.*", "xlwt.*", "msoffcrypto.*", "cv2.*"]
ignore_missing_imports = true

# Celery ships no type hints, so its decorators cannot be typed.
[[tool.mypy.overrides]]
module = ["app.worker.*"]
disallow_untyped_decorators = false

# PyMuPDF has partial annotations, so many of its calls count as untyped.
[[tool.mypy.overrides]]
module = ["app.processing.pdf"]
disallow_untyped_calls = false
