name: docintel

x-backend-common: &backend-common
  build:
    context: ./backend
    target: runtime
    additional_contexts:
      prompts: ./prompts
  image: docintel-backend:latest
  env_file: .env
  environment: &backend-env
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    REDIS_URL: redis://redis:6379/0
    STORAGE_DIR: /data/uploads
  volumes:
    - uploads:/data/uploads

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?copy .env.example to .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env}
      POSTGRES_DB: ${POSTGRES_DB:?copy .env.example to .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot: runs before backend and worker so that replicas never race on migrations.
  migrate:
    <<: *backend-common
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    <<: *backend-common
    restart: unless-stopped
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request as u; u.urlopen('http://localhost:8000/health/ready', timeout=5)"
      interval: 10s
      timeout: 8s
      retries: 12
      start_period: 15s

  worker:
    <<: *backend-common
    restart: unless-stopped
    command:
      - celery
      - --app=app.worker.celery_app:celery_app
      - worker
      - --loglevel=${LOG_LEVEL:-INFO}
      - --concurrency=${WORKER_CONCURRENCY:-2}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - celery --app=app.worker.celery_app:celery_app inspect ping --destination celery@$$HOSTNAME
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    image: docintel-frontend:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy

  # `docker compose --profile test run --rm tests`. Includes the database-backed tests.
  tests:
    <<: *backend-common
    profiles: ["test"]
    build:
      context: ./backend
      target: test
      additional_contexts:
        prompts: ./prompts
    image: docintel-backend-test:latest
    restart: "no"
    environment:
      <<: *backend-env
      APP_ENV: test
      TEST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  uploads:
